<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Logg inn — Scope</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='20' r='18' fill='%23064dff'/%3E%3Ccircle cx='44' cy='40' r='18' fill='%23ff3c38'/%3E%3Ccircle cx='20' cy='40' r='18' fill='%2300bd7b'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="netflix.css?v=20260821-green-brand-v1">
  </head>
  <body class="auth-body">
    <div class="auth-media" aria-hidden="true">
      <img
        src="assets/netflix-hero-restaurant.jpg"
        alt=""
        fetchpriority="high"
        decoding="async"
        width="1672"
        height="941">
    </div>

    <header class="auth-bar">
      <a class="hero-logo" href="/netflix" aria-label="Scope, til forsiden">
        <img src="assets/scope-green-logo.png" alt="Scope" width="1774" height="887">
      </a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Logg inn</h1>
        <p class="auth-intro">Velkommen tilbake. Tallene står klare.</p>

        <form class="auth-form" novalidate>
          <label>
            <span>E-post</span>
            <input type="email" name="email" autocomplete="email" placeholder="ola@restaurant.no" required>
          </label>
          <label>
            <span>Passord</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </label>
          <p class="auth-status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Logg inn</button>
        </form>

        <a class="auth-link" href="mailto:post@scopeanalytics.no?subject=Glemt%20passord">Glemt passordet?</a>

        <p class="auth-alt">
          Ny her? <a href="/landing-3-test-gratis.html">Prøv gratis i 30 dager</a>
        </p>
      </section>
    </main>

    <script src="netflix.js?v=20260816-v4" defer></script>
  </body>
</html>
