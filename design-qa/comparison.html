<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kombi – design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #fff; background: #111; font: 700 14px Arial, sans-serif; }
      header, main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      header { padding: 14px 20px; }
      main { align-items: start; padding: 0 14px 14px; }
      section { padding: 8px; background: #222; }
      img { display: block; width: 100%; height: auto; margin: 0 0 8px; }
      img:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <header><span>Kilde – alternativ 3</span><span>Implementasjon – hero, slik virker, råd, testkunder</span></header>
    <main>
      <section><img src="source-kombi-option-3.png" alt="Valgt designreferanse"></section>
      <section>
        <img src="implementation-desktop-hero.png?v=2" alt="Implementert hero">
        <img src="implementation-desktop-process.png?v=2" alt="Implementert slik virker-seksjon">
        <img src="implementation-desktop-advice.png?v=2" alt="Implementert råddel">
        <img src="implementation-desktop-testcustomers.png?v=2" alt="Implementert testkundedel">
      </section>
    </main>
  </body>
</html>
