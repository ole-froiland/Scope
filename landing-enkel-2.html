<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Scope - Enkel 2.0</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='20' r='18' fill='%23064dff'/%3E%3Ccircle cx='44' cy='40' r='18' fill='%23ff3c38'/%3E%3Ccircle cx='20' cy='40' r='18' fill='%2300bd7b'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="enkel-2.css?v=20260824-enkel2-v14">
  </head>
  <body class="enkel-2-site">
    <main>
      <!-- Riggen står her; all bevegelse regnes ut per frame i enkel-2.js.
           Vingene er fire uavhengige ledd, ikke én gruppe — de må kunne gå i
           utakt. Hver vinge har to bleke ekko som ligger litt bak i slaget og
           smører ut bevegelsen slik at det raske slaget leses som uskarphet. -->
      <svg class="flight" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
        <defs>
          <!-- Vingen: spiss der den fester i kroppen, bred og rund ytterst.
               Tegnet i en 100x100-rute og skalert per vinge. -->
          <path id="enkel2-wing" d="M 0 0 C 20 -75, 48 -100, 72 -100 C 90 -100, 100 -55, 100 0 C 100 55, 90 100, 72 100 C 48 100, 20 75, 0 0 Z"></path>

          <!-- Logoen er ett bilde; utsnittene lar teleskopet og ordmerket komme hver for seg. -->
          <clipPath id="clip-telescope" clipPathUnits="userSpaceOnUse">
            <rect x="0" y="0" width="632" height="887"></rect>
          </clipPath>
          <clipPath id="clip-word" clipPathUnits="userSpaceOnUse">
            <rect x="632" y="0" width="1142" height="887"></rect>
          </clipPath>
        </defs>

        <!-- Kort, raskt falmende slepestrek. Bygges av faktiske posisjoner
             bakover i tid, så den viser hvor hun har vært — aldri en rute. -->
        <g class="wisp">
          <path class="wisp-seg"></path>
          <path class="wisp-seg"></path>
          <path class="wisp-seg"></path>
          <path class="wisp-seg"></path>
          <path class="wisp-seg"></path>
        </g>

        <g class="logo">
          <g class="logo-telescope">
            <image href="/assets/scope-green-logo.png" x="0" y="0" width="1774" height="887" clip-path="url(#clip-telescope)"></image>
          </g>
          <g class="logo-word">
            <image href="/assets/scope-green-logo.png" x="0" y="0" width="1774" height="887" clip-path="url(#clip-word)"></image>
          </g>
        </g>

        <g class="dragonfly">
          <g class="dragonfly-art">
            <!-- Forvinger og bakvinger hver for seg. Under svev går parene i
                 motfase slik ekte øyenstikkere gjør; under akselerasjon
                 nærmer de seg samme fase. -->
            <g class="wing" data-base="-86" data-len="2.21" data-span="0.36" data-side="-1" data-pair="0">
              <use class="wing-echo-2" href="#enkel2-wing"></use>
              <use class="wing-echo-1" href="#enkel2-wing"></use>
              <use class="wing-main" href="#enkel2-wing"></use>
            </g>
            <g class="wing" data-base="-131" data-len="1.68" data-span="0.27" data-side="-1" data-pair="1">
              <use class="wing-echo-2" href="#enkel2-wing"></use>
              <use class="wing-echo-1" href="#enkel2-wing"></use>
              <use class="wing-main" href="#enkel2-wing"></use>
            </g>
            <g class="wing" data-base="46" data-len="1.86" data-span="0.3" data-side="1" data-pair="0">
              <use class="wing-echo-2" href="#enkel2-wing"></use>
              <use class="wing-echo-1" href="#enkel2-wing"></use>
              <use class="wing-main" href="#enkel2-wing"></use>
            </g>
            <g class="wing" data-base="99" data-len="1.49" data-span="0.24" data-side="1" data-pair="1">
              <use class="wing-echo-2" href="#enkel2-wing"></use>
              <use class="wing-echo-1" href="#enkel2-wing"></use>
              <use class="wing-main" href="#enkel2-wing"></use>
            </g>

            <path class="dragonfly-body" d="M 0 0 Q -118 18 -235 8"></path>
            <circle class="dragonfly-head" cx="28" cy="-54" r="40"></circle>
            <circle class="dragonfly-head" cx="54" cy="-8" r="31"></circle>

            <circle class="dragonfly-eye" cx="28" cy="-54" r="22"></circle>
            <path class="dragonfly-pupil" d="M 35.52 -45.04 A 11.7 11.7 0 1 1 35.52 -62.96" stroke-width="9.2"></path>
            <circle class="dragonfly-eye" cx="54" cy="-8" r="17"></circle>
            <path class="dragonfly-pupil" d="M 59.79 -1.11 A 9 9 0 1 1 59.79 -14.89" stroke-width="7.1"></path>
          </g>
        </g>
      </svg>
    </main>
    <script src="enkel-2.js?v=20260824-enkel2-v14"></script>
  </body>
</html>
